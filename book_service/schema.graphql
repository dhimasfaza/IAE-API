type Book {
    id: ID!
    title: String!
    author: String
    year: Int
    jumlah: Int!
}

type Query {
    books: [Book!]!
    book(id: ID!): Book
}

type Mutation {
    createBook(title: String!, author: String, year: Int, jumlah: Int!): Book!
    updateStok(bookId: ID!, jumlah: Int!): Book!
}

schema {
    query: Query
    mutation: Mutation
}