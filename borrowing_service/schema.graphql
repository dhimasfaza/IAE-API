type Query {
  borrowings: [Loan!]!
}

type Mutation {
  borrowBook(memberId: Int!, bookId: Int!, tanggal_peminjaman: String!): Loan!
  returnBook(loanId: Int!): Loan!
}

type Loan {
  id: ID!
  member_id: Int!
  book_id: Int!
  tanggal_peminjaman: String
  tanggal_jatuh_tempo: String
  tanggal_pengembalian: String
  status: String
  denda: Int
}